name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libgtk-4-dev \
            meson ninja-build libwayland-dev wayland-protocols \
            gobject-introspection libgirepository-2.0-dev
          # gtk4-layer-shell is not in Ubuntu 24.04 (ubuntu-latest); build from source when missing.
          if apt-cache show gtk4-layer-shell &>/dev/null; then
            sudo apt-get install -y gtk4-layer-shell
          else
            git clone --depth 1 --branch v1.3.0 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
            meson setup /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell \
              -Dexamples=false -Ddocs=false -Dtests=false -Dintrospection=false -Dvapi=false
            sudo meson compile -C /tmp/gtk4-layer-shell/build
            sudo meson install -C /tmp/gtk4-layer-shell/build
            sudo ldconfig
            pkg-config --exists gtk4-layer-shell-0
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --features overlay -- -D warnings

      - name: Run tests
        run: cargo test --verbose --features overlay
        env:
          RUST_TEST_THREADS: 1
