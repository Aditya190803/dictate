name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (gnu)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Primary Windows target: no Visual Studio required.
          - name: Windows (gnu)
            os: windows-latest
            target: x86_64-pc-windows-gnu
          - name: Windows (msvc)
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      # Toolchain is pinned to stable here (dtolnay/rust-toolchain requires
      # the input; it does not fall back to rust-toolchain.toml), and
      # rust-toolchain.toml adds the rustfmt/clippy components. The matrix
      # target is installed on top.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Swatinem/rust-cache instead of hand-rolled actions/cache on
      # ~/.cargo + target/: it caches the right subset (registry, build
      # fingerprints) and handles key rotation/cleanup automatically.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Windows needs no system packages: audio goes through WASAPI and TLS
      # through SChannel, both provided by windows-sys / native-tls.
      - name: Install system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config \
            libgtk-4-dev cmake clang libclang-dev

      # The gnu target builds raw-dylib import libraries with dlltool, which
      # shells out to `as`. rustup ships neither, so use the runner's MinGW.
      - name: Add MinGW to PATH
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: echo "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Build
        run: cargo build --verbose --target ${{ matrix.target }}

      - name: Run tests
        run: cargo test --verbose --target ${{ matrix.target }}
        env:
          RUST_TEST_THREADS: 1

      # Optional features are Linux-only: words-ui needs GTK4, local needs
      # whisper-rs (cmake + clang). Neither is supported on Windows.
      - name: Clippy (words-ui)
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --features words-ui --target ${{ matrix.target }} -- -D warnings

      - name: Build (local)
        if: runner.os == 'Linux'
        run: cargo build --verbose --features local --target ${{ matrix.target }}

      # Full feature-matrix coverage via `cargo check` (cheap): a full
      # `cargo test --features words-ui,local` build links GTK4 + whisper and
      # is too heavy for every push, so check-only here (`make check-features`
      # runs the same locally). Default features are covered by Build/Test above.
      - name: Check (words-ui + local)
        if: runner.os == 'Linux'
        run: cargo check --all-targets --features words-ui,local --target ${{ matrix.target }}

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      # No deny.toml / audit config stub: rustsec/audit-check needs no local
      # config (it checks Cargo.lock against the RustSec advisory DB fetched
      # at runtime). A license lint (cargo-deny) is intentionally deferred
      # until someone derives the allow-list from a real resolve; see
      # `cargo metadata --format-version 1` output for the license set.
      - name: Audit dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
