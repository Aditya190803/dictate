[package]
name = "dictate"
version = "1.0.5"
edition = "2021"
description = "Speech-to-text tool for Wayland with stdout output"
license = "GPL-3.0-or-later"
authors = ["Artur Roszczyk <artur.roszczyk@gmail.com>"]

[lib]
name = "dictate"
path = "src/lib.rs"

[features]
default = []
local = ["dep:whisper-rs", "dep:hound"]
overlay = ["dep:winit", "dep:softbuffer"]

[dependencies]
# Core dependencies (essential)
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
reqwest = { version = "0.12", features = ["multipart", "stream", "json"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
base64 = "0.22"
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }
futures = "0.3"
clap = { version = "4.0", features = ["derive"] }
inquire = "0.7"
dotenvy = "0.15"
dirs = "5.0"

# Audio capture
cpal = "0.15"

# Structured logging
log = "0.4"
env_logger = "0.11"

# Optional local transcription. Online providers build by default on normal Linux machines.
whisper-rs = { version = "0.15", optional = true }
hound = { version = "3.5", optional = true }

# JSON/TOML parsing for API responses and local text processing config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
regex = "1.10"

# Async trait support
async-trait = "0.1"

# Recording pill (optional binary)
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }


[dev-dependencies]
tempfile = "3.0"
mockito = "1.0"
tokio-test = "0.4"


[[bin]]
name = "dictate"
path = "src/main.rs"

[[bin]]
name = "dictate-overlay"
path = "src/bin/dictate-overlay.rs"
required-features = ["overlay"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
